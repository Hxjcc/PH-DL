name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest suite
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests, type check & production build
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHDL_ADMIN_PASSWORD: local-compose-ci-password
    steps:
      - uses: actions/checkout@v7
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check the frontend and API
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -F 'id="app"'
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.status == "ok"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
