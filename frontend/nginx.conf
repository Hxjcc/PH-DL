# Only trust forwarding headers when the immediate peer is a local/Docker reverse proxy
# (e.g. OpenResty on loopback or Docker bridge). Direct LAN/VPN peers cannot spoof them.
geo $remote_addr $phdl_trusted_upstream {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    172.16.0.0/12 1;
    fc00::/7 1;
}

# Preserve HTTPS from trusted reverse proxy when forwarding to the frontend.
map "$phdl_trusted_upstream:$http_x_forwarded_proto" $phdl_forwarded_proto {
    default $scheme;
    "1:https" https;
}

# Preserve upstream X-Real-IP only from trusted proxies; direct clients always use $remote_addr.
map "$phdl_trusted_upstream:$http_x_real_ip" $phdl_real_ip {
    default $remote_addr;
    "~^1:(.+)$" $1;
}

# Preserve X-Forwarded-For chain only from trusted proxies; strip client-forged chains otherwise.
map "$phdl_trusted_upstream:$http_x_forwarded_for" $phdl_forwarded_for {
    default $remote_addr;
    "~^1:.+$" $proxy_add_x_forwarded_for;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # WebSocket real-time event stream
    location /api/ws {
        proxy_pass http://backend:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $phdl_real_ip;
        proxy_set_header X-Forwarded-For $phdl_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phdl_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend REST API & video relay streams
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $phdl_real_ip;
        proxy_set_header X-Forwarded-For $phdl_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phdl_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Immutable fingerprinted Vite build assets (never fallback to index.html)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Web App Manifest (explicit JSON manifest MIME type)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Entry HTML must always revalidate so new hashed chunks take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
